<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sysmon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #242424;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    gap: 8px;
    padding: 8px;
    height: 100vh;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .widget {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 1 80px;
    min-width: 70px;
    max-width: 160px;
  }
  .ring-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
  }
  .ring-wrap svg {
    width: 100%;
    height: 100%;
    transform: rotate(-135deg);
  }
  .ring-bg { fill: none; stroke: #333; }
  .ring-fg { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }
  .center-label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .val {
    font-size: clamp(14px, 5vw, 24px);
    font-weight: 700;
    color: #e2e8f0;
    line-height: 1;
  }
  .unit {
    font-size: clamp(8px, 2vw, 11px);
    color: #888;
  }
  .label {
    margin-top: 5px;
    font-size: clamp(9px, 2.5vw, 12px);
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-widget {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1 1 80px;
    min-width: 70px;
    max-width: 160px;
  }
  .action-btn {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 50%;
    width: 100%;
    aspect-ratio: 1;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background 0.2s, border-color 0.2s;
    color: #e2e8f0;
  }
  .action-btn:hover { background: #333; border-color: #666; }
  .action-btn.running { border-color: #fb923c; background: #2a1a0a; }
  .action-btn.done    { border-color: #22c55e; background: #0a2a0a; }
  .action-btn .icon { font-size: clamp(18px, 6vw, 28px); line-height: 1; }
  .action-btn .status {
    font-size: clamp(7px, 2vw, 10px);
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="widget">
  <div class="ring-wrap">
    <svg viewBox="0 0 36 36">
      <circle class="ring-bg" cx="18" cy="18" r="15.9" stroke-width="3.2"/>
      <circle id="cpu-ring" class="ring-fg" cx="18" cy="18" r="15.9" stroke-width="3.2"
        stroke="#38bdf8" stroke-dasharray="75 100" stroke-dashoffset="0"/>
    </svg>
    <div class="center-label">
      <div class="val" id="cpu-val">–</div>
      <div class="unit">%</div>
    </div>
  </div>
  <div class="label">CPU</div>
</div>

<div class="widget">
  <div class="ring-wrap">
    <svg viewBox="0 0 36 36">
      <circle class="ring-bg" cx="18" cy="18" r="15.9" stroke-width="3.2"/>
      <circle id="ram-ring" class="ring-fg" cx="18" cy="18" r="15.9" stroke-width="3.2"
        stroke="#a78bfa" stroke-dasharray="75 100" stroke-dashoffset="0"/>
    </svg>
    <div class="center-label">
      <div class="val" id="ram-val">–</div>
      <div class="unit">%</div>
    </div>
  </div>
  <div class="label">RAM</div>
</div>

<div class="widget">
  <div class="ring-wrap">
    <svg viewBox="0 0 36 36">
      <circle class="ring-bg" cx="18" cy="18" r="15.9" stroke-width="3.2"/>
      <circle id="temp-ring" class="ring-fg" cx="18" cy="18" r="15.9" stroke-width="3.2"
        stroke="#fb923c" stroke-dasharray="75 100" stroke-dashoffset="0"/>
    </svg>
    <div class="center-label">
      <div class="val" id="temp-val">–</div>
      <div class="unit">°C</div>
    </div>
  </div>
  <div class="label">TEMP</div>
</div>

<div class="btn-widget">
  <button class="action-btn" id="cleanup-btn" onclick="runCleanup()">
    <span class="icon">🧹</span>
    <span class="status" id="cleanup-status">clean</span>
  </button>
  <div class="label">RAM/CPU</div>
</div>

<script>
async function runCleanup() {
  const btn = document.getElementById('cleanup-btn');
  const status = document.getElementById('cleanup-status');
  if (btn.classList.contains('running')) return;
  btn.classList.add('running');
  status.textContent = '...';
  try {
    const r = await fetch('/action/run', { method: 'POST' });
    btn.classList.remove('running');
    btn.classList.add('done');
    status.textContent = 'done';
    setTimeout(() => { btn.classList.remove('done'); status.textContent = 'clean'; }, 4000);
  } catch(e) {
    btn.classList.remove('running');
    status.textContent = 'error';
    setTimeout(() => { status.textContent = 'clean'; }, 3000);
  }
}

const CIRC = 2 * Math.PI * 15.9; // ~99.9
const ARC  = CIRC * 0.75;        // 270° = 75% of circle

function setRing(ringId, valId, value, max) {
  const pct   = Math.min(1, Math.max(0, value / max));
  const dash  = pct * ARC;
  const gap   = ARC - dash;
  const ring  = document.getElementById(ringId);
  ring.setAttribute('stroke-dasharray', dash.toFixed(2) + ' ' + (CIRC - dash).toFixed(2));
  document.getElementById(valId).textContent = Math.round(value);
}

async function update() {
  try {
    const [cpu, ram, temp] = await Promise.all([
      fetch(`/netdata/api/v1/data?chart=system.cpu&points=1&after=-1&format=json&_=${Date.now()}`).then(r => r.json()),
      fetch(`/netdata/api/v1/data?chart=system.ram&points=1&after=-1&format=json&_=${Date.now()}`).then(r => r.json()),
      fetch(`/netdata/api/v1/data?chart=sensors.temperature_coretemp-isa-0000_temp1_Package_id_0_input&points=1&after=-1&format=json&_=${Date.now()}`).then(r => r.json()),
    ]);

    const cpuPct = cpu.data[0].slice(1).reduce((a, b) => a + b, 0);
    setRing('cpu-ring', 'cpu-val', cpuPct, 100);

    const [, free, used, cached, buffers] = ram.data[0];
    const ramPct = used / (free + used + cached + buffers) * 100;
    setRing('ram-ring', 'ram-val', ramPct, 100);

    const tempVal = temp.data[0][1];
    setRing('temp-ring', 'temp-val', tempVal, 100);
  } catch(e) {
    console.error('sysmon fetch error:', e);
  }
}

update();
setInterval(update, 7000);
</script>
</body>
</html>
