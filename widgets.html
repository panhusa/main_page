<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b1021;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #1a1f2e;
            border: 1px solid #2a3142;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 14px;
            text-transform: uppercase;
            color: #00af87;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        #clock {
            font-size: 48px;
            font-weight: bold;
            font-family: 'Monaco', monospace;
            color: #00af87;
        }
        #date {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        #weather {
            text-align: center;
        }
        .weather-icon { font-size: 64px; margin: 15px 0; }
        .weather-temp { font-size: 36px; color: #00af87; font-weight: bold; }
        .weather-desc { font-size: 14px; color: #888; margin: 10px 0; }
        .weather-details { font-size: 12px; color: #666; margin-top: 15px; }
        #system {
            font-size: 14px;
        }
        .stat-row {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-label { color: #888; }
        .stat-value { color: #00af87; font-weight: bold; font-family: monospace; }
        .progress-bar {
            background: #2a3142;
            height: 6px;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00af87, #ff6b6b);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .notes-section {
            background: #1a1f2e;
            border: 1px solid #2a3142;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }
        .notes-section h2 {
            font-size: 14px;
            text-transform: uppercase;
            color: #00af87;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        #notes-textarea {
            width: 100%;
            min-height: 200px;
            background: #0b1021;
            border: 1px solid #2a3142;
            color: #e0e0e0;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 6px;
            resize: vertical;
        }
        #notes-textarea:focus {
            outline: none;
            border-color: #00af87;
            box-shadow: 0 0 8px rgba(0, 175, 135, 0.2);
        }
        .notes-info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
        .error { color: #ff6b6b; }
        .loading { color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid">
            <div class="card">
                <h2>⏰ Czas</h2>
                <div id="clock">--:--:--</div>
                <div id="date"></div>
            </div>

            <div class="card">
                <h2>🌤️ Pogoda</h2>
                <div id="weather">
                    <div class="loading">Ładowanie...</div>
                </div>
            </div>

            <div class="card">
                <h2>💻 System</h2>
                <div id="system">
                    <div class="loading">Ładowanie...</div>
                </div>
            </div>
        </div>

        <div class="notes-section">
            <h2>📝 Notatki</h2>
            <textarea id="notes-textarea" placeholder="Tutaj możesz dodać szybkie notatki..."></textarea>
            <div class="notes-info">✓ Notatki są automatycznie zapisywane w przeglądarce</div>
        </div>
    </div>

    <script>
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('pl-PL', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('date').textContent = now.toLocaleDateString('pl-PL', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Weather - Open-Meteo
        async function updateWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=50.0755&longitude=14.4378&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&temperature_unit=celsius&timezone=Europe/Prague');
                const data = await response.json();
                const current = data.current;
                
                const weatherIcons = {
                    0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️', 45: '🌫️', 48: '🌫️',
                    51: '🌦️', 53: '🌦️', 55: '🌧️', 61: '🌧️', 63: '⛈️', 65: '⛈️',
                    71: '🌨️', 73: '🌨️', 75: '🌨️', 80: '🌧️', 81: '⛈️', 82: '⛈️',
                    85: '🌨️', 86: '🌨️', 95: '⛈️', 96: '⛈️', 99: '⛈️'
                };

                document.getElementById('weather').innerHTML = `
                    <div class="weather-icon">${weatherIcons[current.weather_code] || '🌤️'}</div>
                    <div class="weather-temp">${Math.round(current.temperature_2m)}°C</div>
                    <div class="weather-details">
                        💨 Wiatr: ${Math.round(current.wind_speed_10m)} km/h<br>
                        💧 Wilgotność: ${current.relative_humidity_2m}%
                    </div>
                `;
            } catch (e) {
                document.getElementById('weather').innerHTML = '<span class="error">Błąd ładowania pogody</span>';
            }
        }
        updateWeather();
        setInterval(updateWeather, 300000); // Update co 5 minut

        // System Info via Grafana/Prometheus or simple stats
        async function updateSystem() {
            try {
                // Try to get from Prometheus
                const cpuResponse = await fetch('http://192.168.1.101:9090/api/v1/query?query=node_cpu_seconds_total', { mode: 'cors' }).catch(() => null);
                
                if (!cpuResponse) {
                    // Fallback - use navigator API
                    const memory = navigator.deviceMemory || 'N/A';
                    const cores = navigator.hardwareConcurrency || 'N/A';
                    document.getElementById('system').innerHTML = `
                        <div class="stat-row">
                            <span class="stat-label">CPU Cores:</span>
                            <span class="stat-value">${cores}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">RAM (estymacja):</span>
                            <span class="stat-value">${memory} GB</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Status:</span>
                            <span class="stat-value">✓ Online</span>
                        </div>
                    `;
                }
            } catch (e) {
                document.getElementById('system').innerHTML = `
                    <div class="stat-row">
                        <span class="stat-label">Status:</span>
                        <span class="stat-value">✓ Online</span>
                    </div>
                    <div style="font-size: 12px; color: #666; margin-top: 10px;">
                        Szczegóły dostępne w Grafana / Prometheus
                    </div>
                `;
            }
        }
        updateSystem();

        // Notes - localStorage
        const notesEl = document.getElementById('notes-textarea');
        notesEl.value = localStorage.getItem('dashboard-notes') || '';
        notesEl.addEventListener('input', (e) => {
            localStorage.setItem('dashboard-notes', e.target.value);
        });
    </script>
</body>
</html>
