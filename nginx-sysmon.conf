server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Netdata exposes detailed host telemetry; keep it on private networks
    # and read-only.
    location /netdata/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        limit_except GET HEAD { deny all; }

        proxy_pass http://192.168.1.101:19999/;
        proxy_set_header Host localhost;
    }

    # Triggers a state-changing action on the host. Private networks only,
    # POST only, and a custom header is required: browsers cannot attach a
    # custom header cross-origin without a CORS preflight (which this
    # endpoint never approves), so other websites cannot fire it (CSRF).
    location /action/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        limit_except POST { deny all; }

        if ($http_x_sysmon_action != "1") {
            return 403;
        }

        proxy_pass http://192.168.1.101:8897/;
        proxy_set_header Host localhost;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
